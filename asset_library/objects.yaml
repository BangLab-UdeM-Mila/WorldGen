# ── Adversarial objects ──────────────────────────────────────
# Visual appearance contradicts physical properties.
# Tests whether models rely on visual priors or infer mass
# from acceleration in the first frames.

- name: foam_anvil
  display_name: Foam Prop Hammer (looks heavy)
  category: adversarial
  morph: mesh
  mesh_path: foam_anvil.obj
  size: [1.0]                    # uniform scale (mesh pre-normalised to ~16 cm longest)
  bottom_z_offset: 0.0           # mesh bottom is at local z=0
  phys_half_x: 0.080
  phys_half_z: 0.034
  density: 40                  # foam: visually looks like a heavy tool but negligible mass
  friction: 0.50
  restitution: 0.60            # bouncy (foam)
  color_rgb: [0.18, 0.18, 0.20]   # dark iron-grey colour
  roughness: 0.85
  ior: 1.0
  catch_safe: true             # ground truth: safe to catch (it's foam)
  safety_label: safe
  mass_hint: light             # despite looking heavy
  description: "Looks like a heavy steel hammer but is actually soft foam — safe to catch"

- name: steel_apple
  display_name: Steel Prop Apple (looks edible)
  category: adversarial
  morph: mesh
  mesh_path: red_apple.obj     # identical mesh to red_apple — only mass betrays it
  size: [1.0]
  bottom_z_offset: 0.0
  phys_half_x: 0.037
  phys_half_z: 0.037
  density: 7800               # steel core disguised as apple
  friction: 0.20
  restitution: 0.08
  color_rgb: [0.82, 0.12, 0.08]   # identical red to real apple
  roughness: 0.10
  ior: 1.0
  catch_safe: false            # ground truth: dangerous (crushes fingers)
  safety_label: dangerous
  mass_hint: heavy             # despite looking like a normal apple
  description: "Painted steel prop the same shape and colour as a real apple — acceleration betrays the mass"

