# ============================================================
# Object Asset Library
# ReactHuman Benchmark
#
# Fields
# ------
# name            : unique identifier
# display_name    : human-readable label
# category        : safe | dangerous | adversarial
# morph           : mesh | sphere | box | cylinder
# mesh_path       : relative to repo assets/meshes/ (morph=mesh only)
# size            : [x,y,z] half-extents in metres (primitives) or
#                   uniform scale factor (mesh)
# bottom_z_offset : local-Z of lowest point (mesh only, signed)
# density         : kg/m³
# friction        : 0.0–5.0
# restitution     : 0.0–1.0
# color_rgb       : [R,G,B] in 0–1
# roughness       : 0.0–1.0
# ior             : index of refraction (1.0 = matte)
# catch_safe      : true → EXECUTE_CATCH, false → TRIGGER_DODGE
# safety_label    : safe | caution | dangerous
# mass_hint       : light | medium | heavy  (for Track-1 reasoning)
# description     : one-line plain-English description
# ============================================================

# ── Safe objects (EXECUTE_CATCH) ────────────────────────────

- name: ceramic_plate
  display_name: Ceramic Dinner Plate
  category: safe
  morph: mesh
  mesh_path: plate.obj
  bottom_z_offset: -0.007    # local Z of bottom rim
  density: 2300
  friction: 0.30
  restitution: 0.15
  color_rgb: [0.97, 0.95, 0.92]
  roughness: 0.06
  ior: 1.52
  catch_safe: true
  safety_label: safe
  mass_hint: light
  description: "A standard white ceramic dinner plate, fragile but harmless"

