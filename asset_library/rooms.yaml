# ============================================================
# Room Template Library
# ReactHuman Benchmark
# ============================================================

rooms:
  - type: dining
    display_name: Dining Room
    width: 5.0
    depth: 4.5
    height: 2.80
    wall_thickness: 0.12
    wall_color_rgb: [0.92, 0.89, 0.84]
    ceiling_color_rgb: [0.96, 0.95, 0.93]
    floor_color_rgb: [0.72, 0.55, 0.33]
    floor_roughness: 0.55
    table_pos: [0.0, 0.0]
    window: {wall: north, pos_x: 0.0, pos_z: 1.45, width: 1.20, height: 1.00, emissive: [6.0, 5.8, 5.2]}
    lighting_preset: warm_pendant

  - type: kitchen
    display_name: Kitchen
    width: 4.0
    depth: 3.5
    height: 2.60
    wall_thickness: 0.12
    wall_color_rgb: [0.94, 0.93, 0.90]
    ceiling_color_rgb: [0.97, 0.97, 0.96]
    floor_color_rgb: [0.80, 0.78, 0.75]
    floor_roughness: 0.40
    table_pos: [-0.2, 0.1]
    window: {wall: north, pos_x: 0.3, pos_z: 1.30, width: 0.90, height: 0.80, emissive: [7.0, 6.5, 5.8]}
    lighting_preset: bright_overhead

  - type: living
    display_name: Living Room
    width: 6.0
    depth: 5.0
    height: 2.80
    wall_thickness: 0.12
    wall_color_rgb: [0.88, 0.86, 0.82]
    ceiling_color_rgb: [0.95, 0.94, 0.92]
    floor_color_rgb: [0.60, 0.48, 0.30]
    floor_roughness: 0.50
    table_pos: [0.3, -0.2]
    window: {wall: north, pos_x: -0.5, pos_z: 1.50, width: 1.60, height: 1.20, emissive: [5.5, 5.2, 4.8]}
    lighting_preset: soft_ambient

  - type: office
    display_name: Home Office
    width: 4.0
    depth: 3.5
    height: 2.70
    wall_thickness: 0.12
    wall_color_rgb: [0.85, 0.87, 0.90]
    ceiling_color_rgb: [0.95, 0.95, 0.96]
    floor_color_rgb: [0.55, 0.48, 0.38]
    floor_roughness: 0.45
    table_pos: [0.0, 0.2]
    window: {wall: north, pos_x: 0.0, pos_z: 1.40, width: 1.00, height: 0.90, emissive: [6.5, 6.2, 5.5]}
    lighting_preset: cool_fluorescent

  - type: stair_landing
    display_name: Stair Landing
    width: 5.0
    depth: 5.0
    height: 2.80
    wall_thickness: 0.12
    wall_color_rgb: [0.88, 0.86, 0.82]
    ceiling_color_rgb: [0.95, 0.94, 0.92]
    floor_color_rgb: [0.65, 0.55, 0.40]
    floor_roughness: 0.60
    table_pos: [0.0, -1.0]
    # Window above the staircase on the north wall (above stair top height ~1.26 m)
    window: {wall: north, pos_x: 0.0, pos_z: 2.10, width: 1.00, height: 0.55, emissive: [6.5, 6.2, 5.8]}
    lighting_preset: soft_ambient
    # Staircase geometry — read by Randomizer._make_stair()
    stair_n_steps: 7
    stair_rise: 0.18        # each step height (metres)
    stair_run: 0.28         # each step tread depth (metres)
    stair_width: 1.20       # staircase width in X (metres)

# ── Lighting presets ─────────────────────────────────────────

lighting_presets:
  warm_pendant:
    ambient_light: [0.28, 0.25, 0.22]
    background_color: [0.15, 0.14, 0.13]
    shadow: true
    lights:
      - {type: point,       pos: [0.10, 0.00, 2.60], color: [1.00, 0.88, 0.72], intensity: 10.0}
      - {type: directional, dir: [-0.20,-1.00,-0.40], color: [0.80, 0.88, 1.00], intensity: 3.5}
      - {type: directional, dir: [0.10, 0.30, 1.00],  color: [0.90, 0.82, 0.70], intensity: 1.0}

  bright_overhead:
    ambient_light: [0.35, 0.35, 0.33]
    background_color: [0.18, 0.18, 0.16]
    shadow: true
    lights:
      - {type: point,       pos: [0.00, 0.00, 2.50], color: [1.00, 0.98, 0.92], intensity: 14.0}
      - {type: directional, dir: [-0.50,-0.80,-0.60], color: [0.85, 0.90, 1.00], intensity: 4.0}

  soft_ambient:
    ambient_light: [0.30, 0.27, 0.24]
    background_color: [0.12, 0.11, 0.10]
    shadow: true
    lights:
      - {type: point, pos: [-0.80, 1.20, 2.40], color: [1.00, 0.90, 0.78], intensity: 7.0}
      - {type: point, pos: [ 1.20,-1.00, 2.40], color: [0.95, 0.85, 0.72], intensity: 6.0}
      - {type: directional, dir: [0.30, 0.60,-1.00], color: [0.75, 0.82, 1.00], intensity: 2.5}

  cool_fluorescent:
    ambient_light: [0.38, 0.38, 0.40]
    background_color: [0.16, 0.16, 0.18]
    shadow: true
    lights:
      - {type: directional, dir: [0.00, 0.00,-1.00], color: [0.95, 0.97, 1.00], intensity: 12.0}
      - {type: directional, dir: [-0.30,-0.50,-0.80], color: [0.80, 0.85, 1.00], intensity: 3.0}
