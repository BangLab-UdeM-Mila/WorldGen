[metadata]
name = reacthuman
version = 0.1.0
description = Evaluation metric suite for the ReactHuman benchmark.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.9
install_requires =
    numpy>=1.24

[options.extras_require]
dev =
    pytest>=7.0
    pytest-cov>=4.0

[options.entry_points]
console_scripts =
    reacthuman = reacthuman.cli:main
